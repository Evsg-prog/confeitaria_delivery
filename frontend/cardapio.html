<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fffaf6">
  <meta name="description" content="Explore bolos, doces, brownies e tortas artesanais.">
  <title>Cardápio | Doce Ateliê</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/pages.css">
  <script src="./js/api.js" defer></script>
  <script src="./js/cart.js" defer></script>
  <script src="./js/layout.js" defer></script>
  <script src="./js/components/product-card.js" defer></script>
  <script src="./js/pages/catalog.js" defer></script>
</head>
<body>
  <div id="app"></div>
  <template id="page-content">
    <main class="catalog-page">
      <section class="page-intro">
        <span class="eyebrow">COM UM TOQUE DE DOÇURA</span>
        <h1>Nosso cardápio</h1>
        <p>Escolha seus favoritos. Tudo preparado artesanalmente para você.</p>
      </section>
      <section class="catalog-controls" aria-label="Filtros do cardápio">
        <div id="category-filters" class="category-filters"><span class="loading-message">Carregando categorias...</span></div>
        <label class="search-box"><span aria-hidden="true">⌕</span><input id="product-search" type="search" placeholder="Buscar no cardápio..." autocomplete="off"><kbd>/</kbd></label>
      </section>
      <div class="catalog-result-heading"><h2 id="catalog-title">Todos os produtos</h2><span id="product-count" class="muted"></span></div>
      <section id="catalog-products" class="product-grid" aria-live="polite"><p class="loading-message">Carregando produtos...</p></section>
    </main>
  </template>
</body>
</html>
