<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fffaf6">
  <meta name="description" content="Doces e confeitos artesanais preparados com carinho. Conheça nosso cardápio.">
  <title>Doce Ateliê | Confeitaria artesanal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./frontend/css/reset.css">
  <link rel="stylesheet" href="./frontend/css/layout.css">
  <link rel="stylesheet" href="./frontend/css/components.css">
  <link rel="stylesheet" href="./frontend/css/pages.css">
  <script src="./frontend/js/api.js" defer></script>
  <script src="./frontend/js/cart.js" defer></script>
  <script src="./frontend/js/layout.js" defer></script>
  <script src="./frontend/js/components/product-card.js" defer></script>
  <script src="./frontend/js/pages/home.js" defer></script>
</head>
<body>
  <div id="app"></div>
  <template id="page-content">
    <main>
      <section class="hero">
        <div class="hero__content">
          <span class="eyebrow">FEITO À MÃO, COM AFETO</span>
          <h1>Um doce momento<br><em>muda o seu dia.</em></h1>
          <p>Confeitaria artesanal para deixar os momentos simples ainda mais especiais.</p>
          <a class="button button--primary" href="./cardapio.html">Explorar cardápio <span aria-hidden="true">→</span></a>
          <div class="hero__note"><span class="hero__note-icon">✳</span> Produção artesanal em pequenos lotes</div>
        </div>
        <div class="hero__art" aria-label="Ilustração decorativa de um bolo">
          <div class="hero__circle"></div>
          <div class="hero__cake"><span>✿</span><i></i><b></b></div>
          <span class="hero__spark hero__spark--one">✳</span>
          <span class="hero__spark hero__spark--two">✦</span>
          <span class="hero__caption">feito com carinho</span>
        </div>
      </section>

      <section class="section-block">
        <div class="section-heading">
          <div><span class="eyebrow">ESCOLHAS DA CASA</span><h2>Queridinhos da confeitaria</h2></div>
          <a class="text-link" href="./cardapio.html">Ver cardápio completo <span aria-hidden="true">→</span></a>
        </div>
        <div id="featured-products" class="product-grid" aria-live="polite">
          <p class="loading-message">Carregando nossos produtos...</p>
        </div>
      </section>

      <section class="callout">
        <span class="callout__icon">♡</span>
        <div><span class="eyebrow">SEU MOMENTO, DO SEU JEITO</span><h2>Escolha, peça e aproveite.</h2><p>Faça seu pedido para receber em casa ou retirar com a gente.</p></div>
        <a class="button button--light" href="./cardapio.html">Fazer pedido <span aria-hidden="true">→</span></a>
      </section>
    </main>
  </template>
</body>
</html>
